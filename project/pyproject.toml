[project]
name = "scope-self-awareness-eval"
version = "0.1.0"
description = "Pilot eval for scope self-awareness in LLM agents (analyst-escalation pilot)"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",  # required by Inspect's openrouter provider
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
